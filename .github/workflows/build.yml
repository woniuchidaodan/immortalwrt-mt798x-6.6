name: 🚀 编译 (Build) - MT798x 闭源 ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      device:
        type: choice
        options: [AX3000T, WR30U]
        default: WR30U
      layout:
        type: choice
        options: [stock, 112m]
        default: 112m
      multithreading:
        type: boolean
        default: true
      ssh:
        type: boolean
        default: false

env:
  DEVICE: ${{ github.event.inputs.device || 'WR30U' }}
  LAYOUT: ${{ github.event.inputs.layout || '112m' }}

permissions: write-all

jobs:
  build:
    if: ${{ inputs.ssh == false }}
    runs-on: ubuntu-22.04
    name: 🚀 编译 (Build)
    outputs:
      fw_version: ${{ steps.extract-version.outputs.fw_version }}
    steps:
      - name: 释放磁盘空间
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h

      - name: 下载编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk gettext git \
            libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-distutils \
            python3-setuptools python3-pyelftools rsync subversion swig time u-boot-tools \
            unzip wget xsltproc zlib1g-dev

      - name: 克隆当前仓库
        uses: actions/checkout@v5

      - name: 克隆闭源 ImmortalWrt 仓库
        uses: actions/checkout@v5
        with:
          repository: 'padavanonly/immortalwrt-mt798x-24.10'
          ref: 'openwrt-24.10-6.6'
          path: ImmortalWrt
          fetch-depth: 0

      - name: 克隆 UA3F
        working-directory: ImmortalWrt
        run: git clone https://github.com/SunBK201/UA3F.git package/UA3F

      - name: 克隆 OpenAppFilter
        working-directory: ImmortalWrt
        run: git clone https://github.com/destan19/OpenAppFilter.git package/OpenAppFilter

      - name: 拉取 quickstart
        working-directory: ImmortalWrt
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/kenzok8/openwrt-packages.git temp_kenzok8
          cd temp_kenzok8
          git sparse-checkout set quickstart luci-app-quickstart luci-app-store \
            luci-lib-taskd luci-lib-xterm taskd
          cd ..
          mv temp_kenzok8/quickstart package/
          mv temp_kenzok8/luci-app-quickstart package/
          mv temp_kenzok8/luci-app-store package/
          mv temp_kenzok8/luci-lib-taskd package/
          mv temp_kenzok8/luci-lib-xterm package/
          mv temp_kenzok8/taskd package/
          rm -rf temp_kenzok8

      - name: 修改 quickstart Makefile
        working-directory: ImmortalWrt
        run: |
          for file in $(find package/ -path "*quickstart*" -name "Makefile" 2>/dev/null); do
            cp "$file" "$file.bak"
            sed -i -E 's/\+shadow[a-z0-9-]*\b//g' "$file"
            sed -i -E 's/\+smartmontools[a-z0-9-]*\b//g' "$file"
            sed -i -E 's/\+smartd\b//g' "$file"
            sed -i -E 's/\+mdadm\b//g' "$file"
          done

      - name: 复制自定义配置
        run: |
          cp -f diy.sh seed.config mt7981-ax3000-slim.config ImmortalWrt/ 2>/dev/null || true

      - name: 运行 diy.sh
        working-directory: ImmortalWrt
        run: |
          if [ -f diy.sh ]; then chmod +x diy.sh; ./diy.sh; fi

      - name: feeds update + install
        working-directory: ImmortalWrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      # ============================================================
      # ★ 核心修复 1：替换失效的下载源
      # ============================================================
      - name: 替换下载源
        working-directory: ImmortalWrt
        run: |
          find . -name "*.mk" -path "*include*" 2>/dev/null | while read f; do
            sed -i 's|mirror2\?\.immortalwrt\.org|sources.openwrt.org|g' "$f"
          done

      - name: 预下载 gnulib
        working-directory: ImmortalWrt
        run: |
          mkdir -p dl
          F="gnulib-c99c8d491850dc3a6e0b8604a2729d8bc5c0eff1.tar.gz"
          [ -f "dl/$F" ] && exit 0
          for url in \
            "https://sources.openwrt.org/$F" \
            "https://sources.cdn.openwrt.org/$F" \
            "https://downloads.openwrt.org/sources/$F"; do
            if wget -q --timeout=30 -O "dl/$F" "$url"; then
              SZ=$(stat -c %s "dl/$F" 2>/dev/null || echo 0)
              [ "$SZ" -gt 10000 ] && { echo "✅ $url"; exit 0; }
              rm -f "dl/$F"
            fi
          done

      - name: 修复 iproute2
        working-directory: ImmortalWrt
        run: |
          D="package/network/utils/iproute2"
          [ -d "$D" ] || exit 0
          mkdir -p "$D/patches"
          P="$D/patches/012-libnetlink-fix-build-with-musl-and-gcc-14.patch"
          {
            echo '--- a/include/libnetlink.h'
            echo '+++ b/include/libnetlink.h'
            echo '@@ -1,5 +1,6 @@'
            echo ' #ifndef __LIBNETLINK_H__'
            echo ' #define __LIBNETLINK_H__ 1'
            echo ' '
            echo '+#include <endian.h>'
            echo ' #include <stdio.h>'
            echo ' #include <string.h>'
          } > "$P"

      - name: 清理 libtool 残留
        working-directory: ImmortalWrt
        run: |
          rm -rf build_dir/host/libtool-* build_dir/host/libtool \
                 staging_dir/host/share/aclocal/libtool.m4 \
                 staging_dir/host/share/aclocal/lt*.m4 \
                 staging_dir/host/bin/libtool* \
                 staging_dir/host/lib/libltdl* || true

      # ============================================================
      # ★★ 核心修复 2：全局禁用 -Werror（最关键！）★★
      # 这是解决 mt_wifi 编译失败的"终极方案"
      # ============================================================
      - name: 全局禁用 -Werror
        working-directory: ImmortalWrt
        run: |
          echo "==== 全局注入 -Wno-error ===="

          # 1. package.mk —— 所有 package 的 TARGET_CFLAGS
          if [ -f "include/package.mk" ]; then
            cp include/package.mk include/package.mk.bak
            if ! grep -q "^TARGET_CFLAGS += -Wno-error$" include/package.mk; then
              echo '' >> include/package.mk
              echo '# ===== 全局禁用 -Werror =====' >> include/package.mk
              echo 'TARGET_CFLAGS += -Wno-error' >> include/package.mk
              echo 'TARGET_CFLAGS += -Wno-error=implicit-function-declaration' >> include/package.mk
              echo 'TARGET_CFLAGS += -Wno-error=incompatible-pointer-types' >> include/package.mk
              echo 'TARGET_CFLAGS += -Wno-error=int-conversion' >> include/package.mk
            fi
            echo "✅ include/package.mk 已修改"
          fi

          # 2. kernel-defaults.mk —— 所有 kmod 的 KCFLAGS（mt_wifi 属于 kmod）
          for f in include/kernel-defaults.mk include/kernel.mk; do
            if [ -f "$f" ]; then
              cp "$f" "$f.bak"
              if ! grep -q "KCFLAGS.*-Wno-error" "$f"; then
                echo '' >> "$f"
                echo '# ===== 全局禁用 -Werror（kmod）=====' >> "$f"
                echo 'KCFLAGS += -Wno-error' >> "$f"
                echo 'KCFLAGS += -Wno-error=implicit-function-declaration' >> "$f"
                echo 'KCFLAGS += -Wno-error=incompatible-pointer-types' >> "$f"
                echo 'KCFLAGS += -Wno-error=int-conversion' >> "$f"
              fi
              echo "✅ $f 已修改"
            fi
          done

          # 3. mt_wifi Makefile 额外加一份兜底
          MTWIFI_MK="package/mtk/drivers/mt_wifi/Makefile"
          if [ -f "$MTWIFI_MK" ]; then
            if ! grep -q "Wno-error" "$MTWIFI_MK"; then
              {
                echo ''
                echo '# ===== 兜底：忽略 GCC 13 严格检查 ====='
                echo 'TARGET_CFLAGS += -Wno-error'
                echo 'TARGET_CFLAGS += -Wno-error=implicit-function-declaration'
                echo 'TARGET_CFLAGS += -Wno-error=incompatible-pointer-types'
                echo 'TARGET_CFLAGS += -Wno-error=int-conversion'
                echo 'TARGET_CFLAGS += -Wno-error=format-nonliteral'
                echo 'TARGET_CFLAGS += -Wno-error=stringop-overflow'
                echo 'TARGET_CFLAGS += -Wno-error=array-bounds'
                echo 'TARGET_CFLAGS += -Wno-error=unused-result'
                echo 'KERNEL_MAKE_FLAGS += KCFLAGS="-Wno-error"'
              } >> "$MTWIFI_MK"
            fi
            echo "✅ $MTWIFI_MK 已修改"
          fi

      # ============================================================
      # 加载设备配置
      # ============================================================
      - name: 加载设备配置
        working-directory: ImmortalWrt
        run: |
          case "${{ env.DEVICE }}-${{ env.LAYOUT }}" in
            WR30U-stock)   TARGET_DEVICE="xiaomi_mi-router-wr30u-stock" ;;
            WR30U-112m)    TARGET_DEVICE="xiaomi_mi-router-wr30u-ubootmod" ;;
            AX3000T-stock) TARGET_DEVICE="xiaomi_mi-router-ax3000t" ;;
            AX3000T-112m)  TARGET_DEVICE="xiaomi_mi-router-ax3000t-mtkuboot" ;;
          esac
          echo "目标: $TARGET_DEVICE"
          cp "../mt7981-ax3000-slim.config" .config

          for dev in xiaomi_mi-router-wr30u-stock xiaomi_mi-router-wr30u-ubootmod \
                     xiaomi_mi-router-ax3000t xiaomi_mi-router-ax3000t-mtkuboot \
                     xiaomi_mi-router-ax3000t-ubootmod; do
            if [ "$dev" != "$TARGET_DEVICE" ]; then
              sed -i "s/^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${dev}=y/# CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${dev} is not set/" .config
              sed -i "s/^CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_${dev}=/# CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_${dev} is not set #/" .config
            fi
          done

          for pkg in shadow shadow-common shadow-utils mdadm smartd smartmontools; do
            sed -i "/CONFIG_PACKAGE_${pkg}=/d" .config
            echo "# CONFIG_PACKAGE_${pkg} is not set" >> .config
          done
          sed -i '/CONFIG_SHADOW_PASSWORDS/d' .config
          echo "# CONFIG_SHADOW_PASSWORDS is not set" >> .config
          sed -i '/CONFIG_LUCI_LANG_zh_Hans/d' .config
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config

          make oldconfig < /dev/null
          SELECTED=$(grep -c "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y" .config || true)
          [ "$SELECTED" -eq 1 ] || { echo "❌ 设备数=$SELECTED"; exit 1; }
          echo "✅ 配置加载完成"

      - name: 单线程编译工具链
        working-directory: ImmortalWrt
        run: |
          set -o pipefail
          make tools/install -j1 V=s 2>&1 | tee tools.log

      # ============================================================
      # ★ 单独编译 mt_wifi，失败自动降级
      # ============================================================
      - name: 单独编译 mt_wifi
        id: mt_wifi_build
        working-directory: ImmortalWrt
        continue-on-error: true
        run: |
          rm -rf build_dir/target-*/linux-*/mt_wifi* 2>/dev/null || true
          make package/mtk/drivers/mt_wifi/compile -j1 V=s 2>&1 | tee mt_wifi.log
          echo ""
          echo "===== mt_wifi 编译错误摘要 ====="
          echo "--- error: 行 ---"
          grep -n "error:" mt_wifi.log | head -30 || echo "(无)"
          echo "--- 最后 50 行 ---"
          tail -50 mt_wifi.log

      - name: 上传 mt_wifi 日志
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mt_wifi-log
          path: ImmortalWrt/mt_wifi.log

      # ============================================================
      # ★★ 如果 mt_wifi 失败，从配置里去掉它继续编 ★★
      # ============================================================
      - name: mt_wifi 失败时降级
        if: ${{ steps.mt_wifi_build.outcome == 'failure' }}
        working-directory: ImmortalWrt
        run: |
          echo "⚠️ mt_wifi 编译失败，将其从配置里移除"
          for pkg in kmod-mt_wifi kmod-mediatek_hnulian kmod-mediatek_hnat kmod-warp \
                     mtwifi-cfg luci-app-mtwifi-cfg luci-i18n-mtwifi-cfg-zh-cn \
                     wifi-dats mtk-smp kmod-mtk_wifi; do
            sed -i "/CONFIG_PACKAGE_${pkg}=/d" .config
            echo "# CONFIG_PACKAGE_${pkg} is not set" >> .config
          done
          for opt in MTK_MT_WIFI MTK_MT_AP_SUPPORT MTK_WIFI_MODE_AP MTK_WIFI_DRIVER \
                     MTK_WIFI_MT_MAC MTK_WHNAT_SUPPORT MTK_WIFI_FW_BIN_LOAD \
                     MTK_MT_MAC; do
            sed -i "/^CONFIG_${opt}=/d" .config
            echo "# CONFIG_${opt} is not set" >> .config
          done
          make oldconfig < /dev/null
          echo "✅ mt_wifi 已从配置移除，将编译不含闭源驱动的固件"

      - name: 编译前上传配置
        uses: actions/upload-artifact@v6
        with:
          name: config-before-build
          path: ImmortalWrt/.config

      # ============================================================
      # 主编译
      # ============================================================
      - name: 多线程编译
        if: ${{ inputs.multithreading == true }}
        working-directory: ImmortalWrt
        run: |
          set -o pipefail
          make -j$(nproc) --output-sync=target V=s 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: 单线程编译
        if: ${{ inputs.multithreading == false }}
        working-directory: ImmortalWrt
        run: |
          set -o pipefail
          make -j1 V=s 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: |
            ImmortalWrt/build.log
            ImmortalWrt/tools.log

      - name: 检查固件
        if: always()
        working-directory: ImmortalWrt
        run: |
          echo "==== bin/targets ===="
          ls -la bin/targets/mediatek/filogic/ 2>/dev/null || true
          echo "==== .bin 文件 ===="
          find bin/targets -name "*.bin" 2>/dev/null | head -20 || true

      - name: 提取版本
        id: extract-version
        working-directory: ImmortalWrt
        run: |
          V=$(git describe --tags 2>/dev/null | sed 's/^v//' || echo "unknown")
          echo "fw_version=$V" >> $GITHUB_OUTPUT
          echo "FW_VERSION=$V" >> $GITHUB_ENV

      - name: 上传编译结果
        uses: actions/upload-artifact@v6
        with:
          name: ImmortalWrt_${{ env.FW_VERSION }}_${{ env.DEVICE }}_${{ env.LAYOUT }}
          path: ImmortalWrt/bin/targets

  release:
    name: 📦 发布
    needs: build
    if: ${{ needs.build.result == 'success' }}
    uses: ./.github/workflows/release.yml
    with:
      device: ${{ github.event.inputs.device || 'WR30U' }}
      layout: ${{ github.event.inputs.layout || '112m' }}
      fw_version: ${{ needs.build.outputs.fw_version }}
      run_number: ${{ github.run_number }}
