name: 🚀 编译 (Build) - MT798x 闭源 ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      device:
        type: choice
        options: [AX3000T, WR30U]
        default: WR30U
      layout:
        type: choice
        options: [stock, 112m]
        default: 112m
      multithreading:
        type: boolean
        default: true
      ssh:
        type: boolean
        default: false

env:
  DEVICE: ${{ github.event.inputs.device || 'WR30U' }}
  LAYOUT: ${{ github.event.inputs.layout || '112m' }}

permissions: write-all

jobs:
  build:
    if: ${{ inputs.ssh == false }}
    runs-on: ubuntu-22.04
    name: 🚀 编译 (Build)
    outputs:
      fw_version: ${{ steps.extract-version.outputs.fw_version }}
    steps:
      - name: 释放磁盘空间
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h

      - name: 下载编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk gettext git \
            libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-distutils \
            python3-setuptools python3-pyelftools rsync subversion swig time u-boot-tools \
            unzip wget xsltproc zlib1g-dev

      - name: 克隆当前仓库
        uses: actions/checkout@v5

      # ============================================================
      # 原分支 openwrt-24.10-6.6
      # ============================================================
      - name: 克隆闭源 ImmortalWrt 仓库
        uses: actions/checkout@v5
        with:
          repository: 'padavanonly/immortalwrt-mt798x-6.6'
          ref: 'openwrt-24.10-6.6'
          path: ImmortalWrt
          fetch-depth: 0

      - name: 校验版本
        working-directory: ImmortalWrt
        run: |
          git describe --tags 2>/dev/null || true
          git log -1 --oneline

      - name: 克隆 UA3F
        working-directory: ImmortalWrt
        run: git clone https://github.com/SunBK201/UA3F.git package/UA3F || true

      - name: 克隆 OpenAppFilter
        working-directory: ImmortalWrt
        run: git clone https://github.com/destan19/OpenAppFilter.git package/OpenAppFilter || true

      - name: 拉取 quickstart
        working-directory: ImmortalWrt
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/kenzok8/openwrt-packages.git temp_kenzok8 || true
          if [ -d temp_kenzok8 ]; then
            cd temp_kenzok8
            git sparse-checkout set quickstart luci-app-quickstart luci-app-store \
              luci-lib-taskd luci-lib-xterm taskd
            cd ..
            mv temp_kenzok8/quickstart package/ 2>/dev/null || true
            mv temp_kenzok8/luci-app-quickstart package/ 2>/dev/null || true
            mv temp_kenzok8/luci-app-store package/ 2>/dev/null || true
            mv temp_kenzok8/luci-lib-taskd package/ 2>/dev/null || true
            mv temp_kenzok8/luci-lib-xterm package/ 2>/dev/null || true
            mv temp_kenzok8/taskd package/ 2>/dev/null || true
            rm -rf temp_kenzok8
          fi

      - name: 修改 quickstart Makefile
        working-directory: ImmortalWrt
        run: |
          for file in $(find package/ -path "*quickstart*" -name "Makefile" 2>/dev/null); do
            cp "$file" "$file.bak" 2>/dev/null || true
            sed -i -E 's/\+shadow[a-z0-9-]*\b//g' "$file" || true
            sed -i -E 's/\+smartmontools[a-z0-9-]*\b//g' "$file" || true
            sed -i -E 's/\+smartd\b//g' "$file" || true
            sed -i -E 's/\+mdadm\b//g' "$file" || true
          done

      - name: 复制自定义配置
        run: |
          cp -f diy.sh seed.config mt7981-ax3000-slim.config ImmortalWrt/ 2>/dev/null || true

      - name: 运行 diy.sh
        working-directory: ImmortalWrt
        run: |
          if [ -f diy.sh ]; then chmod +x diy.sh; ./diy.sh || true; fi

      - name: feeds update + install
        working-directory: ImmortalWrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 替换下载源
        working-directory: ImmortalWrt
        run: |
          find . -name "*.mk" -path "*include*" 2>/dev/null | while read f; do
            sed -i 's|mirror2\?\.immortalwrt\.org|sources.openwrt.org|g' "$f"
          done

      - name: 预下载 gnulib
        working-directory: ImmortalWrt
        run: |
          mkdir -p dl
          F="gnulib-c99c8d491850dc3a6e0b8604a2729d8bc5c0eff1.tar.gz"
          [ -f "dl/$F" ] && exit 0
          for url in \
            "https://sources.openwrt.org/$F" \
            "https://sources.cdn.openwrt.org/$F" \
            "https://downloads.openwrt.org/sources/$F"; do
            if wget -q --timeout=30 -O "dl/$F" "$url"; then
              SZ=$(stat -c %s "dl/$F" 2>/dev/null || echo 0)
              [ "$SZ" -gt 10000 ] && { echo "✅ $url"; exit 0; }
              rm -f "dl/$F"
            fi
          done

      - name: 修复 iproute2
        working-directory: ImmortalWrt
        run: |
          D="package/network/utils/iproute2"
          [ -d "$D" ] || exit 0
          mkdir -p "$D/patches"
          P="$D/patches/012-libnetlink-fix-build-with-musl-and-gcc-14.patch"
          {
            echo '--- a/include/libnetlink.h'
            echo '+++ b/include/libnetlink.h'
            echo '@@ -1,5 +1,6 @@'
            echo ' #ifndef __LIBNETLINK_H__'
            echo ' #define __LIBNETLINK_H__ 1'
            echo ' '
            echo '+#include <endian.h>'
            echo ' #include <stdio.h>'
            echo ' #include <string.h>'
          } > "$P"

      - name: 清理 libtool 残留
        working-directory: ImmortalWrt
        run: |
          rm -rf build_dir/host/libtool-* build_dir/host/libtool \
                 staging_dir/host/share/aclocal/libtool.m4 \
                 staging_dir/host/share/aclocal/lt*.m4 \
                 staging_dir/host/bin/libtool* \
                 staging_dir/host/lib/libltdl* || true

      - name: 全局 -Wno-error
        working-directory: ImmortalWrt
        run: |
          for f in include/package.mk include/kernel-defaults.mk; do
            if [ -f "$f" ]; then
              cp "$f" "$f.bak"
              {
                echo ''
                echo 'TARGET_CFLAGS += -Wno-error'
                echo 'TARGET_CFLAGS += -Wno-error=implicit-function-declaration'
                echo 'TARGET_CFLAGS += -Wno-error=incompatible-pointer-types'
                echo 'TARGET_CFLAGS += -Wno-error=int-conversion'
                echo 'KCFLAGS += -Wno-error'
                echo 'KCFLAGS += -Wno-error=implicit-function-declaration'
                echo 'KCFLAGS += -Wno-error=incompatible-pointer-types'
                echo 'KCFLAGS += -Wno-error=int-conversion'
              } >> "$f"
            fi
          done
          MTWIFI_MK="package/mtk/drivers/mt_wifi/Makefile"
          if [ -f "$MTWIFI_MK" ]; then
            {
              echo ''
              echo 'KCFLAGS += -Wno-error'
              echo 'KCFLAGS += -Wno-error=implicit-function-declaration'
              echo 'KCFLAGS += -Wno-error=incompatible-pointer-types'
              echo 'KCFLAGS += -Wno-error=int-conversion'
              echo 'KCFLAGS += -Wno-error=format-nonliteral'
            } >> "$MTWIFI_MK"
          fi

      # ============================================================
      # ★ 修复 1：ap_cfg.c 的 pStaMacAddr 未声明
      # ============================================================
      - name: 修复 ap_cfg.c 的 pStaMacAddr 未声明
        working-directory: ImmortalWrt
        run: |
          APCFG=$(find package/mtk/drivers/mt_wifi -name "ap_cfg.c" 2>/dev/null | head -1)
          if [ -z "$APCFG" ]; then echo "⚠️ 未找到"; exit 0; fi
          echo "路径: $APCFG"
          cp "$APCFG" "$APCFG.bak"
          sed -i 's/^\(\s*\)os_alloc_mem(NULL, &pStaMacAddr, MAC_ADDR_LEN);/\1PUCHAR pStaMacAddr = NULL;\n\1os_alloc_mem(NULL, \&pStaMacAddr, MAC_ADDR_LEN);/g' "$APCFG"
          DECL_COUNT=$(grep -c "PUCHAR pStaMacAddr = NULL;" "$APCFG" || true)
          USE_COUNT=$(grep -c "os_alloc_mem(NULL, &pStaMacAddr" "$APCFG" || true)
          echo "声明数: $DECL_COUNT，使用数: $USE_COUNT"
          [ "$DECL_COUNT" -ge "$USE_COUNT" ] && echo "✅ pStaMacAddr 修复成功" || echo "⚠️ 可能失败"

      # ============================================================
      # ★ 修复 2：eeprom.c 缺失的 7 个预校准宏
      # ============================================================
      - name: 修复 eeprom.c 缺失的预校准宏
        working-directory: ImmortalWrt
        run: |
          EEPROM=$(find package/mtk/drivers/mt_wifi -name "eeprom.c" 2>/dev/null | head -1)
          if [ -z "$EEPROM" ]; then echo "⚠️ 未找到 eeprom.c"; exit 0; fi
          echo "路径: $EEPROM"
          cp "$EEPROM" "$EEPROM.bak"

          if grep -q "MTK_PRE_CAL_LAYOUT_FIX" "$EEPROM"; then
            echo "⏭️ 已修复过，跳过"
            exit 0
          fi

          sed -i '0,/^#include/{s/^#include/#define MTK_PRE_CAL_LAYOUT_FIX 1\n#define PRE_CAL_SIZE_ONE_CARD   0x10000\n#define PRECALPART_OFFSET       0x0\n#define DCOC_IMAGE_SIZE         0x1000\n#define TXDPD_IMAGE1_SIZE       0x1000\n#define TXDPD_IMAGE2_SIZE       0x1000\n#define DPDPART1_OFFSET         0x1000\n#define DPDPART2_OFFSET         0x2000\n#include/}' "$EEPROM"

          echo "==== 修复后前 20 行 ===="
          head -20 "$EEPROM"

          echo ""
          echo "==== 验证宏定义 ===="
          for m in PRE_CAL_SIZE_ONE_CARD PRECALPART_OFFSET DCOC_IMAGE_SIZE TXDPD_IMAGE1_SIZE TXDPD_IMAGE2_SIZE DPDPART1_OFFSET DPDPART2_OFFSET; do
            if grep -q "define $m" "$EEPROM"; then
              echo "✅ $m"
            else
              echo "❌ $m 缺失"
            fi
          done

      # ============================================================
      # ★ 修复 3：rt_profile.c 的 netif_rx_ni 在 Linux 6.6 被删除
      # ============================================================
      - name: 修复 rt_profile.c 的 netif_rx_ni
        working-directory: ImmortalWrt
        run: |
          RTPROFILE=$(find package/mtk/drivers/mt_wifi -name "rt_profile.c" 2>/dev/null | head -1)
          if [ -z "$RTPROFILE" ]; then echo "⚠️ 未找到 rt_profile.c"; exit 0; fi
          echo "路径: $RTPROFILE"
          cp "$RTPROFILE" "$RTPROFILE.bak"

          echo "==== 修复前 netif_rx_ni 出现位置 ===="
          grep -n "netif_rx_ni" "$RTPROFILE" || echo "(无)"

          # Linux 6.6 中 netif_rx_ni 已删除，用 netif_rx 替代
          sed -i 's/netif_rx_ni(/netif_rx(/g' "$RTPROFILE"

          echo ""
          echo "==== 修复后 ===="
          grep -n "netif_rx" "$RTPROFILE" || echo "(无)"

          COUNT=$(grep -c "netif_rx_ni" "$RTPROFILE" || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "✅ netif_rx_ni 已全部替换为 netif_rx"
          else
            echo "⚠️ 还剩 $COUNT 处 netif_rx_ni"
          fi

      # ============================================================
      # 加载设备配置
      # ============================================================
      - name: 加载设备配置
        working-directory: ImmortalWrt
        run: |
          case "${{ env.DEVICE }}-${{ env.LAYOUT }}" in
            WR30U-stock)   TARGET_DEVICE="xiaomi_mi-router-wr30u-stock" ;;
            WR30U-112m)    TARGET_DEVICE="xiaomi_mi-router-wr30u-ubootmod" ;;
            AX3000T-stock) TARGET_DEVICE="xiaomi_mi-router-ax3000t" ;;
            AX3000T-112m)  TARGET_DEVICE="xiaomi_mi-router-ax3000t-mtkuboot" ;;
          esac
          echo "📦 目标设备: $TARGET_DEVICE"

          cp "../mt7981-ax3000-slim.config" .config

          for dev in xiaomi_mi-router-wr30u-stock xiaomi_mi-router-wr30u-ubootmod \
                     xiaomi_mi-router-ax3000t xiaomi_mi-router-ax3000t-mtkuboot \
                     xiaomi_mi-router-ax3000t-ubootmod; do
            if [ "$dev" != "$TARGET_DEVICE" ]; then
              sed -i "s/^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${dev}=y/# CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${dev} is not set/" .config
              sed -i "s/^CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_${dev}=/# CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_${dev} is not set #/" .config
            fi
          done

          if [ -f "../seed.config" ]; then
            grep '^CONFIG_PACKAGE_' ../seed.config >> .config 2>/dev/null || true
          fi

          for pkg in shadow shadow-common shadow-utils shadow-chage shadow-chfn shadow-chgpasswd \
                     shadow-chpasswd shadow-chsh shadow-expiry shadow-faillog shadow-gpasswd \
                     shadow-groupadd shadow-groupdel shadow-groupmems shadow-groupmod shadow-groups \
                     shadow-grpck shadow-grpconv shadow-grpunconv shadow-lastlog shadow-login \
                     shadow-logoutd shadow-newgidmap shadow-newgrp shadow-newuidmap shadow-newusers \
                     shadow-nologin shadow-passwd shadow-pwck shadow-pwconv shadow-pwunconv \
                     shadow-su shadow-useradd shadow-userdel shadow-usermod shadow-vipw \
                     smartd smartmontools smartmontools-drivedb mdadm; do
            sed -i "/CONFIG_PACKAGE_${pkg}=/d" .config
            echo "# CONFIG_PACKAGE_${pkg} is not set" >> .config
          done

          sed -i '/CONFIG_SHADOW_PASSWORDS/d' .config
          echo "# CONFIG_SHADOW_PASSWORDS is not set" >> .config
          sed -i '/CONFIG_LUCI_LANG_zh_Hans/d' .config
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config

          make oldconfig < /dev/null

          SELECTED=$(grep -c "^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y" .config || true)
          [ "$SELECTED" -eq 1 ] || { echo "❌ 设备数=$SELECTED"; exit 1; }
          echo "✅ 配置加载完成：$TARGET_DEVICE"

      - name: 编译 tools 和 toolchain
        working-directory: ImmortalWrt
        run: |
          set -o pipefail
          make tools/install -j$(nproc) V=s 2>&1 | tail -10
          make toolchain/install -j$(nproc) V=s 2>&1 | tail -10
          ls -la staging_dir/toolchain-*/lib/ld-musl-* 2>/dev/null || echo "⚠️ 未找到 ld-musl"

      - name: 编译 Linux 内核
        working-directory: ImmortalWrt
        run: |
          make target/linux/compile -j$(nproc) V=s 2>&1 | tail -20

      - name: 多线程编译
        if: ${{ inputs.multithreading == true }}
        working-directory: ImmortalWrt
        run: |
          set -o pipefail
          make -j$(nproc) --output-sync=target V=s 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: 单线程编译
        if: ${{ inputs.multithreading == false }}
        working-directory: ImmortalWrt
        run: |
          set -o pipefail
          make -j1 V=s 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: ImmortalWrt/build.log

      - name: 检查固件
        if: always()
        working-directory: ImmortalWrt
        run: |
          echo "==== bin/targets ===="
          ls -la bin/targets/mediatek/filogic/ 2>/dev/null || true
          echo "==== .bin 文件 ===="
          find bin/targets -name "*.bin" -type f 2>/dev/null | head -20 || true
          echo "==== 失败包 ===="
          grep "failed to build" build.log 2>/dev/null | sort -u || true

      - name: 提取版本
        id: extract-version
        working-directory: ImmortalWrt
        run: |
          V=$(git describe --tags 2>/dev/null | sed 's/^v//' || echo "unknown")
          echo "fw_version=$V" >> $GITHUB_OUTPUT
          echo "FW_VERSION=$V" >> $GITHUB_ENV

      - name: 上传编译结果
        uses: actions/upload-artifact@v6
        with:
          name: ImmortalWrt_${{ env.FW_VERSION }}_${{ env.DEVICE }}_${{ env.LAYOUT }}
          path: ImmortalWrt/bin/targets

  release:
    name: 📦 发布固件
    needs: build
    if: ${{ needs.build.result == 'success' }}
    uses: ./.github/workflows/release.yml
    with:
      device: ${{ github.event.inputs.device || 'WR30U' }}
      layout: ${{ github.event.inputs.layout || '112m' }}
      fw_version: ${{ needs.build.outputs.fw_version }}
      run_number: ${{ github.run_number }}
