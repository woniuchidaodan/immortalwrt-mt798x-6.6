name: 🔍 排查 mt_wifi（含内核 + 修复 pStaMacAddr）

on:
  workflow_dispatch:

permissions: write-all

jobs:
  debug:
    runs-on: ubuntu-22.04
    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: 装依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk gettext git \
            libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python3-distutils \
            python3-setuptools python3-pyelftools rsync subversion swig time u-boot-tools \
            unzip wget xsltproc zlib1g-dev

      - name: 克隆当前仓库
        uses: actions/checkout@v5

      - name: 克隆源码
        uses: actions/checkout@v5
        with:
          repository: 'padavanonly/immortalwrt-mt798x-24.10'
          ref: 'openwrt-24.10-6.6'
          path: ImmortalWrt
          fetch-depth: 0

      - name: 复制配置
        run: |
          cp -f mt7981-ax3000-slim.config ImmortalWrt/.config 2>/dev/null || true

      - name: feeds
        working-directory: ImmortalWrt
        run: ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 替换下载源
        working-directory: ImmortalWrt
        run: |
          find . -name "*.mk" -path "*include*" 2>/dev/null | while read f; do
            sed -i 's|mirror2\?\.immortalwrt\.org|sources.openwrt.org|g' "$f"
          done

      - name: 修复 iproute2
        working-directory: ImmortalWrt
        run: |
          D="package/network/utils/iproute2"
          [ -d "$D" ] || exit 0
          mkdir -p "$D/patches"
          P="$D/patches/012-libnetlink-fix-build-with-musl-and-gcc-14.patch"
          {
            echo '--- a/include/libnetlink.h'
            echo '+++ b/include/libnetlink.h'
            echo '@@ -1,5 +1,6 @@'
            echo ' #ifndef __LIBNETLINK_H__'
            echo ' #define __LIBNETLINK_H__ 1'
            echo ' '
            echo '+#include <endian.h>'
            echo ' #include <stdio.h>'
            echo ' #include <string.h>'
          } > "$P"

      - name: 全局 -Wno-error
        working-directory: ImmortalWrt
        run: |
          for f in include/package.mk include/kernel-defaults.mk; do
            if [ -f "$f" ]; then
              cp "$f" "$f.bak"
              {
                echo ''
                echo 'TARGET_CFLAGS += -Wno-error'
                echo 'TARGET_CFLAGS += -Wno-error=implicit-function-declaration'
                echo 'TARGET_CFLAGS += -Wno-error=incompatible-pointer-types'
                echo 'TARGET_CFLAGS += -Wno-error=int-conversion'
                echo 'KCFLAGS += -Wno-error'
                echo 'KCFLAGS += -Wno-error=implicit-function-declaration'
                echo 'KCFLAGS += -Wno-error=incompatible-pointer-types'
                echo 'KCFLAGS += -Wno-error=int-conversion'
              } >> "$f"
            fi
          done
          MTWIFI_MK="package/mtk/drivers/mt_wifi/Makefile"
          if [ -f "$MTWIFI_MK" ]; then
            {
              echo ''
              echo 'KCFLAGS += -Wno-error'
              echo 'KCFLAGS += -Wno-error=implicit-function-declaration'
              echo 'KCFLAGS += -Wno-error=incompatible-pointer-types'
              echo 'KCFLAGS += -Wno-error=int-conversion'
              echo 'KCFLAGS += -Wno-error=format-nonliteral'
            } >> "$MTWIFI_MK"
          fi

      # ============================================================
      # ★★★ 关键修复：给 ap_cfg.c 补上 pStaMacAddr 声明 ★★★
      # ============================================================
      - name: 修复 ap_cfg.c 的 pStaMacAddr 未声明
        working-directory: ImmortalWrt
        run: |
          echo "==== 查找 ap_cfg.c ===="
          APCFG=$(find package/mtk/drivers/mt_wifi -name "ap_cfg.c" 2>/dev/null | head -1)
          echo "路径: $APCFG"
          [ -n "$APCFG" ] || { echo "❌ 未找到"; exit 1; }

          echo "==== 修改前 pStaMacAddr 出现位置 ===="
          grep -n "pStaMacAddr" "$APCFG"

          # 备份
          cp "$APCFG" "$APCFG.bak"

          # 在每个 os_alloc_mem(NULL, &pStaMacAddr, MAC_ADDR_LEN); 前面插入声明
          # 使用 \s* 匹配行首空白，\1 保留缩进
          sed -i 's/^\(\s*\)os_alloc_mem(NULL, &pStaMacAddr, MAC_ADDR_LEN);/\1PUCHAR pStaMacAddr = NULL;\n\1os_alloc_mem(NULL, \&pStaMacAddr, MAC_ADDR_LEN);/g' "$APCFG"

          echo ""
          echo "==== 修改后 pStaMacAddr 出现位置 ===="
          grep -n "pStaMacAddr" "$APCFG"

          echo ""
          echo "==== 验证：声明数量应该 >= 使用次数 ===="
          DECL_COUNT=$(grep -c "PUCHAR pStaMacAddr = NULL;" "$APCFG" || true)
          USE_COUNT=$(grep -c "os_alloc_mem(NULL, &pStaMacAddr" "$APCFG" || true)
          echo "声明数: $DECL_COUNT，使用数: $USE_COUNT"
          [ "$DECL_COUNT" -ge "$USE_COUNT" ] && echo "✅ 修复成功" || echo "⚠️ 可能失败"

      - name: 加载设备
        working-directory: ImmortalWrt
        run: |
          cp ../mt7981-ax3000-slim.config .config
          TARGET_DEVICE="xiaomi_mi-router-wr30u-ubootmod"
          for dev in xiaomi_mi-router-wr30u-stock xiaomi_mi-router-wr30u-ubootmod \
                     xiaomi_mi-router-ax3000t xiaomi_mi-router-ax3000t-mtkuboot \
                     xiaomi_mi-router-ax3000t-ubootmod; do
            if [ "$dev" != "$TARGET_DEVICE" ]; then
              sed -i "s/^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${dev}=y/# CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${dev} is not set/" .config
              sed -i "s/^CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_${dev}=/# CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_${dev} is not set #/" .config
            fi
          done
          for pkg in shadow shadow-common shadow-utils mdadm smartd smartmontools; do
            sed -i "/CONFIG_PACKAGE_${pkg}=/d" .config
            echo "# CONFIG_PACKAGE_${pkg} is not set" >> .config
          done
          make oldconfig < /dev/null
          grep "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y" .config

      - name: 编译 tools
        working-directory: ImmortalWrt
        run: make tools/install -j$(nproc) V=s 2>&1 | tail -5

      - name: 编译 toolchain
        working-directory: ImmortalWrt
        run: make toolchain/install -j$(nproc) V=s 2>&1 | tail -5

      - name: 编译 Linux 内核
        working-directory: ImmortalWrt
        run: |
          make target/linux/compile -j$(nproc) V=s 2>&1 | tee kernel.log | tail -20
          ls -la build_dir/target-aarch64_cortex-a53_musl/linux-mediatek_filogic/linux-6.6.133/.config 2>/dev/null || echo "⚠️ 内核 .config 不存在"

      - name: 编译 mt_wifi
        working-directory: ImmortalWrt
        continue-on-error: true
        run: |
          rm -rf build_dir/target-*/linux-*/mt_wifi* 2>/dev/null || true
          make package/mtk/drivers/mt_wifi/compile -j$(nproc) V=s > mt_wifi.log 2>&1 || true

      - name: 打印 mt_wifi 结果
        if: always()
        working-directory: ImmortalWrt
        run: |
          echo "==== error: 行 ===="
          grep -n "error:" mt_wifi.log | head -30 || echo "(无)"
          echo ""
          echo "==== 最后 30 行 ===="
          tail -30 mt_wifi.log

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: logs
          path: |
            ImmortalWrt/mt_wifi.log
            ImmortalWrt/kernel.log