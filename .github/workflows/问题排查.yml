name: 🔍 诊断 mt_cmd.c

on:
  workflow_dispatch:

permissions: write-all

jobs:
  diag:
    runs-on: ubuntu-22.04
    steps:
      - name: 克隆仓库
        uses: actions/checkout@v5
        with:
          repository: 'padawanonly/immortalwrt-mt798x-6.6'
          ref: 'openwrt-24.10-6.6'
          path: ImmortalWrt
          fetch-depth: 1
        continue-on-error: true

      - name: 如果上面失败，用正确仓库名
        run: |
          if [ ! -d ImmortalWrt/package ]; then
            rm -rf ImmortalWrt
            git clone --depth 1 --branch openwrt-24.10-6.6 \
              https://github.com/padawanonly/immortalwrt-mt798x-6.6.git ImmortalWrt
          fi
          ls ImmortalWrt/package/mtk/drivers/mt_wifi/src/mt_wifi/ 2>/dev/null || echo "❌ 路径不对"

      - name: 诊断 mt_cmd.c
        working-directory: ImmortalWrt
        run: |
          MTCMD=$(find package/mtk/drivers/mt_wifi -name "mt_cmd.c" 2>/dev/null | head -1)
          echo "路径: $MTCMD"

          echo ""
          echo "=================================================="
          echo "===== 第 10370 ~ 10385 行 ====="
          echo "=================================================="
          sed -n '10370,10385p' "$MTCMD"

          echo ""
          echo "=================================================="
          echo "===== 第 10458 ~ 10472 行 ====="
          echo "=================================================="
          sed -n '10458,10472p' "$MTCMD"

          echo ""
          echo "=================================================="
          echo "===== 第 11595 ~ 11615 行 ====="
          echo "=================================================="
          sed -n '11595,11615p' "$MTCMD"

          echo ""
          echo "=================================================="
          echo "===== 第 11720 ~ 11740 行 ====="
          echo "=================================================="
          sed -n '11720,11740p' "$MTCMD"

          echo ""
          echo "=================================================="
          echo "===== 各错误所在函数的签名（往上找） ====="
          echo "=================================================="
          for L in 10377 10465 11606 11730; do
            echo "--- 第 $L 行往上找函数 ---"
            head -n $L "$MTCMD" | grep -nE "^(static |VOID |INT |UINT |BOOLEAN |NDIS_STATUS |void |int ).*\(" | tail -1
            echo ""
          done

          echo "=================================================="
          echo "===== MTWF_DBG 宏定义 ====="
          echo "=================================================="
          DEBUGH=$(find package/mtk/drivers/mt_wifi -name "debug.h" 2>/dev/null | head -1)
          grep -n "define MTWF_DBG" "$DEBUGH" || echo "(未找到)"
