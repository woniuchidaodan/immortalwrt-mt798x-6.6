name: 🔍 诊断 mt_cmd.c

on:
  workflow_dispatch:

permissions: write-all

jobs:
  diag:
    runs-on: ubuntu-22.04
    steps:
      - name: 克隆闭源仓库
        uses: actions/checkout@v5
        with:
          repository: 'padavanonly/immortalwrt-mt798x-6.6'
          ref: 'openwrt-24.10-6.6'
          path: ImmortalWrt
          fetch-depth: 1

      - name: 诊断 mt_cmd.c
        working-directory: ImmortalWrt
        run: |
          echo "=================================================="
          echo "===== 找 mt_cmd.c ====="
          echo "=================================================="
          MTCMD=$(find package/mtk/drivers/mt_wifi -name "mt_cmd.c" 2>/dev/null | head -1)
          echo "路径: $MTCMD"
          [ -n "$MTCMD" ] || { echo "❌ 未找到"; exit 1; }

          echo ""
          echo "=================================================="
          echo "===== 第 10370 ~ 10385 行 ====="
          echo "=================================================="
          sed -n '10370,10385p' "$MTCMD"

          echo ""
          echo "=================================================="
          echo "===== 第 10458 ~ 10472 行 ====="
          echo "=================================================="
          sed -n '10458,10472p' "$MTCMD"

          echo ""
          echo "=================================================="
          echo "===== 第 11595 ~ 11615 行 ====="
          echo "=================================================="
          sed -n '11595,11615p' "$MTCMD"

          echo ""
          echo "=================================================="
          echo "===== 第 11720 ~ 11740 行 ====="
          echo "=================================================="
          sed -n '11720,11740p' "$MTCMD"

          echo ""
          echo "=================================================="
          echo "===== 各错误所在函数签名（往上找）====="
          echo "=================================================="
          for L in 10377 10465 11606 11730; do
            echo "--- 第 $L 行所在函数 ---"
            head -n $L "$MTCMD" | grep -nE "^(static |VOID |INT |UINT |BOOLEAN |NDIS_STATUS |void |int |unsigned ).*\(" | tail -1
            echo ""
          done

          echo "=================================================="
          echo "===== MTWF_DBG 宏定义 ====="
          echo "=================================================="
          DEBUGH=$(find package/mtk/drivers/mt_wifi -name "debug.h" 2>/dev/null | head -1)
          echo "路径: $DEBUGH"
          grep -n -A 10 "define MTWF_DBG" "$DEBUGH" | head -30 || echo "(未找到)"
